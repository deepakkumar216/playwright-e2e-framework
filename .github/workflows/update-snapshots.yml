name: Update Visual Baselines

# Run this by hand after an intended UI change, or once to create the first Linux baselines.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Regenerate Linux screenshots
        run: npx playwright test --grep @visual --update-snapshots
        env:
          HOME: /root

      - name: Commit updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          git diff --cached --quiet && echo "No baseline changes" && exit 0
          git commit -m "chore: update Linux visual baselines"
          git push
